name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pytest python-dotenv

      - name: Syntax check
        run: |
          python -m py_compile oracle/miden_oracle.py
          python -m py_compile cli/miden_cli.py

      - name: Unit tests
        run: pytest tests/ -v

