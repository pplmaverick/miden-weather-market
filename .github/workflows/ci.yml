name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pytest python-dotenv

      - name: Syntax check
        run: |
          python -m py_compile oracle/miden_oracle.py
          python -m py_compile cli/miden_cli.py

      - name: Unit tests
        run: pytest tests/ -v

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
        shell: bash

      - name: Cargo check (wasm32-wasip2)
        working-directory: weather-market
        run: cargo check --target wasm32-wasip2
